version: '3.8'

services:
  app:
    image: python:3.13.14-trixie
    command: "bash -c 'pip install  -r requirements.txt && python -m debugpy --listen 0.0.0.0:5678 runserver.py'"
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 8080:8080
      - 5678:5678

  db:
    image: postgres:13.7
    environment:
      # Si c'est un container de prod -> mots de largement passe insuffisant
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: app
      POSTGRES_DB: app

    ports:
      - '5435:5432'

    volumes:
      - app-volume:/var/lib/postgresql/data

volumes:
  app-volume:
